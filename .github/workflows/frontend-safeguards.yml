name: Frontend nonclinical safeguards

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-safeguards.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-safeguards.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: No clinical inputs or misleading risk results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run static and sample-workflow regression tests
        run: node --test frontend/tests/nonclinical-demo.test.cjs
