name: Health profile (full stack)

# Proves sign-in, private health profiles (MA-04) and the demo medication check (MA-05)
# end to end with nothing mocked: a real PostgreSQL service, the FastAPI app under
# uvicorn and the compiled React build in Chromium. FastAPI is stopped and started
# again between the browser phases, and Patient B's sessions are expired directly in
# PostgreSQL before phase 3. All accounts and entries are fictional.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/health-profile-fullstack.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/health-profile-fullstack.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullstack:
    name: Sign-in, persistence, isolation and conflicts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: medassist
          # Throwaway credential for this job's disposable container only.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: medassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medassist -d medassist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: medassist
      PGPASSWORD: ci-only-not-a-secret
      MEDASSIST_DATABASE_URL: postgresql://medassist:ci-only-not-a-secret@localhost:5432/medassist_test
      MEDASSIST_CORS_ORIGINS: http://127.0.0.1:4173
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Migrate a database that already holds the consultation directory
        working-directory: backend
        run: |
          python -m alembic upgrade 0001
          python -m app.seed
          before="$(psql -d medassist_test -Atc 'SELECT md5(string_agg(t::text, $$|$$ ORDER BY id)) FROM consultation_listings t')"
          python -m alembic upgrade head
          python -m alembic current | tee /dev/stderr | grep -q "0002 (head)"
          after="$(psql -d medassist_test -Atc 'SELECT md5(string_agg(t::text, $$|$$ ORDER BY id)) FROM consultation_listings t')"
          test "$before" = "$after"
          echo "Consultation listings unchanged by the upgrade ($after)."
          psql -d medassist_test -Atc "SELECT string_agg(tablename, ', ' ORDER BY tablename) FROM pg_tables WHERE schemaname = 'public'"
      - name: Migrate a fresh, empty database
        working-directory: backend
        env:
          MEDASSIST_DATABASE_URL: postgresql://medassist:ci-only-not-a-secret@localhost:5432/medassist_fresh_test
        run: |
          createdb medassist_fresh_test
          python -m alembic upgrade head
          tables="$(psql -d medassist_fresh_test -Atc "SELECT string_agg(tablename, ',' ORDER BY tablename) FROM pg_tables WHERE schemaname = 'public'")"
          echo "$tables"
          test "$tables" = "accounts,alembic_version,auth_sessions,consultation_listings,consultation_sources,health_profile_entries,health_profiles"
      - name: Create the two fictional demo accounts
        working-directory: backend
        env:
          MEDASSIST_ALLOW_DEMO_ACCOUNTS: "1"
        run: |
          python -m app.seed_demo_accounts
          python -m app.seed_demo_accounts
          echo "PATIENT_A_ID=$(psql -d medassist_test -Atc "SELECT id FROM accounts WHERE email = 'patient.a@example.test'")" >> "$GITHUB_ENV"
      - name: Start FastAPI
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api-before-restart.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the frontend against the local API
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npx vite build --outDir dist-fullstack --logLevel warn
      - name: Install Chromium and required browser libraries
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: "Phase 1: Patient A saves a profile and reloads the page"
        working-directory: frontend
        run: npx playwright test -c playwright.fullstack.config.ts --grep @before-restart
      - name: Restart FastAPI
        working-directory: backend
        run: |
          old="$(cat "$RUNNER_TEMP/api.pid")"
          kill "$old"
          for attempt in $(seq 1 30); do kill -0 "$old" 2>/dev/null || break; sleep 1; done
          if kill -0 "$old" 2>/dev/null; then echo "The old FastAPI process is still running." >&2; exit 1; fi
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api-after-restart.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          echo "FastAPI restarted: process $old replaced by $(cat "$RUNNER_TEMP/api.pid")."
      - name: "Phase 2: persistence after restart, isolation, tampering, sign-out and conflicts"
        working-directory: frontend
        run: npx playwright test -c playwright.fullstack.config.ts --grep @after-restart
      - name: Expire Patient B's sessions in PostgreSQL
        run: |
          psql -d medassist_test -v ON_ERROR_STOP=1 -c "UPDATE auth_sessions SET idle_expires_at = now() - interval '1 minute' WHERE revoked_at IS NULL AND account_id = (SELECT id FROM accounts WHERE email = 'patient.b@example.test')"
      - name: "Phase 3: an expired session is refused"
        working-directory: frontend
        run: npx playwright test -c playwright.fullstack.config.ts --grep @expired
      - name: "Phase 4: demo medication checks read each patient's saved profile"
        working-directory: frontend
        run: npx playwright test -c playwright.fullstack.config.ts --grep @medication-check
      - name: Call the medication check directly while signed out
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/me/medication-check)"
          echo "Signed-out medication check: $status"
          test "$status" = "401"
      - name: Check that API logs hold no credentials or profile contents
        run: |
          cat "$RUNNER_TEMP"/api-*.log | tail -n 40
          if grep -E "MedAssist-Demo|Tarvexol|Mirelune|Sample pollen|Sample condition|Velorin|Brivanol|Coldaway|patient\.[ab]@example" "$RUNNER_TEMP"/api-*.log; then
            echo "A credential or profile entry appeared in the API log." >&2
            exit 1
          fi
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-profile-fullstack-diagnostics
          path: |
            frontend/test-results/
            ${{ runner.temp }}/api-*.log
          retention-days: 7
