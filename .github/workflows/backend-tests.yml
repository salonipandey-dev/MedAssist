name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: backend
    env:
      MEDASSIST_CORS_ORIGINS: ""
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run HTTP contract and configuration tests
        run: python -m unittest discover -s tests -v

  integration:
    name: PostgreSQL integration on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: medassist
          # Throwaway credential for this job's disposable container only.
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: medassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medassist -d medassist_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MEDASSIST_CORS_ORIGINS: ""
      MEDASSIST_TEST_DATABASE_URL: postgresql://medassist:ci-only-not-a-secret@localhost:5432/medassist_test
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Migrate a clean database and seed it twice
        env:
          MEDASSIST_DATABASE_URL: ${{ env.MEDASSIST_TEST_DATABASE_URL }}
        run: |
          python -m alembic upgrade head
          python -m app.seed
          python -m app.seed
      - name: Run the suite with the database tests enabled
        run: python -m unittest discover -s tests -v
