name: Report screenshots

# Captures the agreed report screenshots (SS01–SS12) from the real production build of the
# pull request's head commit, uploads them with the generated manifest as an artifact, and
# publishes the same files to a separate review branch (report-screenshots/<sha>) so they can
# be inspected and committed by a person. The pull request branch itself is never modified.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/report-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture report screenshots
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the pull request head (not the merge commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium and required browser libraries
        run: npx playwright install --with-deps chromium
      - name: Capture screenshots from the built application
        env:
          TZ: Asia/Kolkata
        run: npm run screenshots:report
      - name: Upload screenshots and manifest
        uses: actions/upload-artifact@v4
        with:
          name: report-screenshots
          path: |
            docs/screenshots/report/
            docs/SCREENSHOT_MANIFEST.md
          retention-days: 30
      - name: Publish screenshots to a review branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          short="${SOURCE_SHA:0:7}"
          stage="$(mktemp -d)"
          cp -r docs/screenshots/report "$stage/report"
          cp docs/SCREENSHOT_MANIFEST.md "$stage/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "report-screenshots/$short"
          git rm -rfq .
          rm -rf docs
          mkdir -p docs/screenshots
          cp -r "$stage/report" docs/screenshots/report
          cp "$stage/SCREENSHOT_MANIFEST.md" docs/
          git add docs
          git commit -qm "Report screenshots captured from $SOURCE_SHA"
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/report-screenshots/$short"
