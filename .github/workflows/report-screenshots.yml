name: Report screenshots

# Captures the agreed report screenshots (SS01–SS12) from the real production build of the
# pull request's head commit and uploads them, with the generated manifest, as an artifact.
# Nothing is committed automatically.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/report-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture report screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the pull request head (not the merge commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium and required browser libraries
        run: npx playwright install --with-deps chromium
      - name: Capture screenshots from the built application
        env:
          TZ: Asia/Kolkata
        run: npm run screenshots:report
      - name: Upload screenshots and manifest
        uses: actions/upload-artifact@v4
        with:
          name: report-screenshots
          path: |
            docs/screenshots/report/
            docs/SCREENSHOT_MANIFEST.md
          retention-days: 30
